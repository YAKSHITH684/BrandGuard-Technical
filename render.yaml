services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service: FastAPI + pgvector + Groq
  # ---------------------------------------------------------------------------
  - type: web
    name: brandguard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: JWT_SECRET
        generateValue: true
      - key: CONFIDENCE_THRESHOLD
        value: "0.65"
      - key: EMBEDDING_MODEL
        value: "all-MiniLM-L6-v2"
      - key: GROQ_API_KEY
        sync: false # Set in Render Dashboard
      - key: FRONTEND_URL
        value: https://brandguard-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: brandguard-db
          property: connectionString

  # ---------------------------------------------------------------------------
  # 2. Frontend Web Service: Next.js + Tailwind CSS
  # ---------------------------------------------------------------------------
  - type: web
    name: brandguard-web
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        value: https://brandguard-api.onrender.com/api

# -----------------------------------------------------------------------------
# 3. Managed PostgreSQL Database with pgvector support
# -----------------------------------------------------------------------------
databases:
  - name: brandguard-db
    databaseName: brandguard
    user: brandguard_user
    plan: free
