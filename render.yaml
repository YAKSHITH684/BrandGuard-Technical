services:
  # ---------------------------------------------------------------------------
  # 1. Web Service: FastAPI Backend (Python 3.12)
  # ---------------------------------------------------------------------------
  - type: web
    name: brandguard-technical1
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: JWT_SECRET
        generateValue: true
      - key: CONFIDENCE_THRESHOLD
        value: "0.65"
      - key: EMBEDDING_MODEL
        value: "all-MiniLM-L6-v2"
      - key: GROQ_API_KEY
        sync: false # Enter your Groq API key in Render Dashboard
      - key: FRONTEND_URL
        value: https://brandguard-technical.onrender.com
      - key: DATABASE_URL
        value: sqlite:///./brandguard.db

  # ---------------------------------------------------------------------------
  # 2. Static Site: Next.js Frontend (Pure HTML/CSS/JS on Render Global CDN)
  # ---------------------------------------------------------------------------
  - type: static
    name: brandguard-technical
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://brandguard-technical1.onrender.com/api

# -----------------------------------------------------------------------------
# 3. Managed PostgreSQL Database with pgvector support
# -----------------------------------------------------------------------------
databases:
  - name: brandguard-db
    databaseName: brandguard
    user: brandguard_user
    plan: free
